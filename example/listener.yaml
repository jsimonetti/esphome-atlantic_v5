substitutions:
  board: esp32dev

esphome:
  name: atlantic-v5-listener

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components

# M0.5: mode selection + bus_capture harvesting (3.5.5). Entities land at M4.
atlantic_v5:
  id: dhw
  mode: listener
  bus_capture: true
  hmi:
    uart_num: 1
    rx_pin: GPIO16
