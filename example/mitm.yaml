substitutions:
  board: arduino_nano_esp32
  # Overridden to ../components by CI, so the workflow validates the code in the
  # tree rather than whatever the pinned ref happens to hold.
  atlantic_v5_source: github://jsimonetti/esphome-atlantic_v5@v0.2

esphome:
  name: atlantic-v5-mitm

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:

external_components:
  - source: ${atlantic_v5_source}
    components: [atlantic_v5]

atlantic_v5:
  id: dhw
  mode: mitm
  capture:
    bus: true
    # Post-CRC frame capture, one tag per catalogue category.
    mapped: false
    unmapped: false
    unknown: false
  timeout: 60s
  # Bus timing (defaults shown; uncomment to tune on unfamiliar hardware).
  # frame_silence: 4000us
  hmi:
    uart_num: 1
    rx_pin: GPIO7
    tx_pin: GPIO8
    # tx_enable_pin + one_wire_mirror are both required on revision-2.0 hardware.
    tx_enable_pin: GPIO10
    one_wire_mirror: true
    # dir_setup: 10us
    # dir_hold: 0us
  main:
    uart_num: 2
    rx_pin: GPIO5
    tx_pin: GPIO6
    tx_enable_pin: GPIO9
    one_wire_mirror: true
    # dir_setup: 10us
    # dir_hold: 0us

sensor:
  - platform: atlantic_v5
    water_temperature:
      name: Water temperature
    compressor_outlet_temperature:
      name: Compressor outlet temperature
    air_inlet_temperature:
      name: Air inlet temperature
    evaporator_1_temperature:
      name: Evaporator 1 temperature
    evaporator_2_temperature:
      name: Evaporator 2 temperature
    evaporator_3_temperature:
      name: Evaporator 3 temperature
    setpoint_min:
      name: Setpoint min
    setpoint_max:
      name: Setpoint max
    water_temperature_min:
      name: Water temperature min
    water_temperature_max:
      name: Water temperature max
    compressor_outlet_temperature_min:
      name: Compressor outlet temperature min
    compressor_outlet_temperature_max:
      name: Compressor outlet temperature max
    air_inlet_temperature_min:
      name: Air inlet temperature min
    air_inlet_temperature_max:
      name: Air inlet temperature max
    evaporator_1_temperature_min:
      name: Evaporator 1 temperature min
    evaporator_1_temperature_max:
      name: Evaporator 1 temperature max
    evaporator_2_temperature_min:
      name: Evaporator 2 temperature min
    evaporator_2_temperature_max:
      name: Evaporator 2 temperature max
    evaporator_3_temperature_min:
      name: Evaporator 3 temperature min
    evaporator_3_temperature_max:
      name: Evaporator 3 temperature max
    cycle_1_count:
      name: Cycle 1 count
    cycle_2_count:
      name: Cycle 2 count
    cycle_3_count:
      name: Cycle 3 count
    cycle_4_count:
      name: Cycle 4 count
    cycle_5_count:
      name: Cycle 5 count
    cycle_6_count:
      name: Cycle 6 count
    # Framing counters, mitm-only spelling: one assembler per side, reported
    # separately so a dead side is visible. In mode: listener the unsuffixed
    # names (valid_frames, crc_errors, dropped_bytes) are used instead.
    valid_frames_hmi:
      name: Valid frames HMI
    crc_errors_hmi:
      name: CRC errors HMI
    dropped_bytes_hmi:
      name: Dropped bytes HMI
    valid_frames_main:
      name: Valid frames MAIN
    crc_errors_main:
      name: CRC errors MAIN
    dropped_bytes_main:
      name: Dropped bytes MAIN
    unknown_frames:
      name: Unknown frames
    frames_relayed:
      name: Frames relayed
    rewrites_applied:
      name: Rewrites applied
    queue_overflows:
      name: Queue overflows
    relay_latency_max_us:
      name: Relay latency max
    relay_latency_avg_us:
      name: Relay latency avg
    task_stack_free:
      name: Relay task stack free

binary_sensor:
  - platform: atlantic_v5
    connected:
      name: Connected
    heating_active:
      name: Heating compressor
    heating_element_active:
      name: Heating element
    input_i1:
      name: Input I1
    input_i2:
      name: Input I2
    cycle_1_active:
      name: Cycle 1 active
    cycle_2_active:
      name: Cycle 2 active
    cycle_3_active:
      name: Cycle 3 active
    cycle_4_active:
      name: Cycle 4 active
    cycle_5_active:
      name: Cycle 5 active
    cycle_6_active:
      name: Cycle 6 active

text_sensor:
  - platform: atlantic_v5
    controller_firmware_version:
      name: Firmware version
    appliance_serial:
      name: Serial number
    product_code:
      name: Product code
    power_board_version:
      name: Power board version
    controller_model:
      name: Controller model
    hmi_firmware_version:
      name: HMI version
    hmi_model:
      name: HMI model

select:
  - platform: atlantic_v5
    control_mode:
      name: Operation mode
