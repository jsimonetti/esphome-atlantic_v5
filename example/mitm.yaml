substitutions:
  board: arduino_nano_esp32

esphome:
  name: atlantic-v5-mitm

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components

atlantic_v5:
  id: dhw
  mode: mitm
  bus_capture: true
  timeout: 60s
  # Bus timing (defaults shown; uncomment to tune on unfamiliar hardware).
  # frame_silence: 4000us
  # echo_drain: 200us
  hmi:
    uart_num: 1
    rx_pin: GPIO7
    tx_pin: GPIO8
    # tx_enable_pin + one_wire_mirror are both required on revision-2.0 hardware.
    tx_enable_pin: GPIO10
    one_wire_mirror: true
    # dir_setup: 10us
    # dir_hold: 0us
  main:
    uart_num: 2
    rx_pin: GPIO5
    tx_pin: GPIO6
    tx_enable_pin: GPIO9
    one_wire_mirror: true
    # dir_setup: 10us
    # dir_hold: 0us

sensor:
  - platform: atlantic_v5
    water_temperature:
      name: DHW water temperature
    compressor_outlet_temperature:
      name: DHW compressor outlet temperature
    air_inlet_temperature:
      name: DHW air inlet temperature
    evaporator_1_temperature:
      name: DHW evaporator 1 temperature
    evaporator_2_temperature:
      name: DHW evaporator 2 temperature
    evaporator_3_temperature:
      name: DHW evaporator 3 temperature
    setpoint:
      name: DHW setpoint
    water_temperature_min:
      name: DHW water temperature min
    water_temperature_max:
      name: DHW water temperature max
    compressor_outlet_temperature_min:
      name: DHW compressor outlet temperature min
    compressor_outlet_temperature_max:
      name: DHW compressor outlet temperature max
    air_inlet_temperature_min:
      name: DHW air inlet temperature min
    air_inlet_temperature_max:
      name: DHW air inlet temperature max
    evaporator_1_temperature_min:
      name: DHW evaporator 1 temperature min
    evaporator_1_temperature_max:
      name: DHW evaporator 1 temperature max
    evaporator_2_temperature_min:
      name: DHW evaporator 2 temperature min
    evaporator_2_temperature_max:
      name: DHW evaporator 2 temperature max
    evaporator_3_temperature_min:
      name: DHW evaporator 3 temperature min
    evaporator_3_temperature_max:
      name: DHW evaporator 3 temperature max
    cycle_1_count:
      name: DHW cycle 1 count
    cycle_2_count:
      name: DHW cycle 2 count
    cycle_3_count:
      name: DHW cycle 3 count
    cycle_4_count:
      name: DHW cycle 4 count
    cycle_5_count:
      name: DHW cycle 5 count
    cycle_6_count:
      name: DHW cycle 6 count
    # Framing counters, mitm-only spelling: one assembler per side, reported
    # separately so a dead side is visible. In mode: listener the unsuffixed
    # names (valid_frames, crc_errors, dropped_bytes) are used instead.
    valid_frames_hmi:
      name: DHW valid frames HMI
    crc_errors_hmi:
      name: DHW CRC errors HMI
    dropped_bytes_hmi:
      name: DHW dropped bytes HMI
    valid_frames_main:
      name: DHW valid frames MAIN
    crc_errors_main:
      name: DHW CRC errors MAIN
    dropped_bytes_main:
      name: DHW dropped bytes MAIN
    unknown_frames:
      name: DHW unknown frames
    length_mismatches:
      name: DHW length mismatches
    text_length_variants:
      name: DHW text length variants
    frames_relayed:
      name: DHW frames relayed
    rewrites_applied:
      name: DHW rewrites applied
    echo_bytes:
      name: DHW echo bytes
    queue_overflows:
      name: DHW queue overflows
    relay_latency_max_us:
      name: DHW relay latency max
    relay_latency_avg_us:
      name: DHW relay latency avg
    task_stack_free:
      name: DHW relay task stack free

binary_sensor:
  - platform: atlantic_v5
    connected:
      name: DHW connected
    heating_active:
      name: DHW heating
    input_i1:
      name: DHW input I1
    input_i2:
      name: DHW input I2
    cycle_1_active:
      name: DHW cycle 1 active
    cycle_2_active:
      name: DHW cycle 2 active
    cycle_3_active:
      name: DHW cycle 3 active
    cycle_4_active:
      name: DHW cycle 4 active
    cycle_5_active:
      name: DHW cycle 5 active
    cycle_6_active:
      name: DHW cycle 6 active

text_sensor:
  - platform: atlantic_v5
    firmware_version:
      name: DHW firmware version
    serial_number:
      name: DHW serial number
    power_board_version:
      name: DHW power board version
    controller_model:
      name: DHW controller model
    hmi_version:
      name: DHW HMI version
    hmi_model:
      name: DHW HMI model
    last_unknown_frame:
      name: DHW last unknown frame

select:
  - platform: atlantic_v5
    control_mode:
      name: DHW operation mode

switch:
  - platform: atlantic_v5
    log_raw_frames:
      name: DHW log raw frames
